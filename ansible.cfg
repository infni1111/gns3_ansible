[defaults]
inventory            = inventory/gns3_dynamic.yml
# roles/ est à la racine, pas à côté des playbooks de playbooks/ : on le déclare.
roles_path           = roles
host_key_checking    = False
retry_files_enabled  = False
interpreter_python   = auto_silent
gathering            = explicit
# L'ancien callback community.general.yaml a été retiré : même rendu avec le
# callback par défaut.
stdout_callback      = default
result_format        = yaml

[persistent_connection]
command_timeout = 60
connect_timeout = 60
