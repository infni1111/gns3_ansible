---
# PHASE 1 — Bootstrap des routeurs MikroTik par la CONSOLE telnet GNS3.
#
# But : poser une IP de management joignable + activer SSH, pour que la
# phase 2 (configure_routers.yml, en SSH) puisse prendre le relais.
#
# Pourquoi par la console ? Un nœud GNS3 fraîchement créé n'a aucune IP : on
# ne peut donc PAS encore le joindre en SSH. La console telnet (localhost:port,
# exposée par GNS3 dès la création) est le seul point d'accès garanti.
#
# Pourquoi appeler tools/bootstrap_console.py plutôt que le module expect ?
#   - séquencement du boot (réveille la console, réessaie tant que le login
#     n'apparaît pas) — le nœud n'est pas joignable instantanément ;
#   - CHR 7.x FORCE un changement de mot de passe au 1er login : il faut en
#     poser un, sinon SSH refusera la phase 2 ;
#   - RouterOS pollue le flux d'ANSI : pexpect avec motifs tolérants + log de
#     session complet est bien plus robuste et débogable que des `responses`.
# Le module expect ne couvrait aucun de ces cas proprement.
#
# Ce playbook tourne en local (les ports console sont sur l'hôte).
#
# Prérequis hôte :  paquet `telnet` + module python `pexpect`
#   sudo apt install telnet && pip install pexpect
#
# Pour CALER la séquence sur une nouvelle image, lance d'abord le mode observe :
#   python3 tools/bootstrap_console.py observe --port <port-console>

- name: Bootstrap MikroTik (console telnet -> IP mgmt + SSH)
  hosts: routers
  gather_facts: false
  connection: local

  vars:
    # IP de management par convention : dernier octet = 10 + index du routeur.
    # r1 -> .11, r2 -> .12 ...  (override possible via host_vars/<nom>.yml)
    mgmt_ip: "{{ mgmt_network | regex_replace('0$', '') }}{{ 10 + (inventory_hostname | regex_replace('^[a-z]+', '') | int) }}"
    mgmt_iface: "ether1"   # interface de management côté MikroTik
    bootstrap_script: "{{ playbook_dir }}/../tools/bootstrap_console.py"
    # Log de session par routeur : indispensable pour déboguer une séquence ANSI.
    bootstrap_log: "/tmp/bootstrap_{{ inventory_hostname }}.log"

  tasks:
    - name: Jouer la séquence de bootstrap console
      ansible.builtin.command:
        argv:
          - python3
          - "{{ bootstrap_script }}"
          - bootstrap
          - "--host"
          - "{{ gns3_console_host }}"
          - "--port"
          - "{{ gns3_console_port }}"
          - "--mgmt-ip"
          - "{{ mgmt_ip }}"
          - "--prefix"
          - "{{ mgmt_prefix }}"
          - "--iface"
          - "{{ mgmt_iface }}"
          - "--new-password"
          - "{{ mgmt_password }}"
          - "--log"
          - "{{ bootstrap_log }}"
      register: bootstrap
      changed_when: true
      # Le script peut sortir en erreur si la séquence ANSI dérape : on ne fait
      # pas échouer toute la run ici, le wait_for SSH ci-dessous tranchera.
      failed_when: false

    - name: Tracer la sortie du bootstrap (debug)
      ansible.builtin.debug:
        msg: "{{ bootstrap.stdout_lines | default([]) }} (log: {{ bootstrap_log }})"

    - name: Mémoriser l'IP de management posée (pour la phase SSH)
      ansible.builtin.set_fact:
        ansible_host: "{{ mgmt_ip }}"

    - name: Attendre que SSH réponde sur l'IP de management
      ansible.builtin.wait_for:
        host: "{{ mgmt_ip }}"
        port: 22
        timeout: 60
      delegate_to: localhost
