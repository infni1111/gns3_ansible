---
# PHASE 1 — Bootstrap des équipements MikroTik (routeurs ET switches CHR, groupe
# `routeros`) par la CONSOLE telnet GNS3.
#
# But : poser une IP de management joignable + activer SSH et l'API, pour que
# la phase 2 (configure_network.yml, via l'API RouterOS) puisse prendre le relais.
# Idempotent : un équipement dont l'API répond déjà sur son IP de management
# est sauté — le relancer ne repasse pas par la console.
#
# Pourquoi par la console ? Un nœud GNS3 fraîchement créé n'a aucune IP : on
# ne peut donc PAS encore le joindre en SSH. La console telnet (exposée par
# GNS3 dès la création) est le seul point d'accès garanti.
#
# Pourquoi appeler tools/bootstrap_console.py plutôt que le module expect ?
#   - séquencement du boot (réveille la console, réessaie tant que le login
#     n'apparaît pas) — le nœud n'est pas joignable instantanément ;
#   - CHR 7.x FORCE un changement de mot de passe au 1er login : il faut en
#     poser un, sinon SSH refusera la phase 2 ;
#   - RouterOS pollue le flux d'ANSI : pexpect avec motifs tolérants + log de
#     session complet est bien plus robuste et débogable que des `responses`.
# Le module expect ne couvrait aucun de ces cas proprement.
#
# Ce playbook tourne sur le contrôleur (les ports console sont exposés par GNS3).
#
# Prérequis hôte :  paquet `telnet` + module python `pexpect`
#   sudo apt install telnet && pip install pexpect
#
# Pour CALER la séquence sur une nouvelle image, lance d'abord le mode observe :
#   python3 tools/bootstrap_console.py observe --port <port-console>

- name: Bootstrap MikroTik (console telnet -> IP mgmt + SSH + API)
  hosts: routeros
  gather_facts: false

  vars:
    # Variable de play : elle l'emporte sur le network_cli de
    # inventory/group_vars/routeros.yml — ici tout se joue en local.
    ansible_connection: local
    # mgmt_ip vient de inventory/group_vars/all.yml (r1 -> .11, sw1 -> .21 …)
    mgmt_iface: "ether1"   # interface de management côté MikroTik
    bootstrap_script: "{{ playbook_dir }}/../tools/bootstrap_console.py"
    # Log de session par équipement : indispensable pour déboguer une séquence ANSI.
    bootstrap_log: "/tmp/bootstrap_{{ inventory_hostname }}.log"

  tasks:
    - name: Déjà bootstrappé ? (l'API répond sur l'IP de management)
      ansible.builtin.wait_for:
        host: "{{ mgmt_ip }}"
        port: 8728
        timeout: 3
      register: already
      ignore_errors: true

    - name: Jouer la séquence de bootstrap console
      when: already is failed
      ansible.builtin.command:
        argv:
          - python3
          - "{{ bootstrap_script }}"
          - bootstrap
          - "--host"
          - "{{ gns3_console_host }}"
          - "--port"
          - "{{ gns3_console_port }}"
          - "--mgmt-ip"
          - "{{ mgmt_ip }}"
          - "--prefix"
          - "{{ mgmt_prefix }}"
          - "--iface"
          - "{{ mgmt_iface }}"
          - "--new-password"
          - "{{ mgmt_password }}"
          - "--log"
          - "{{ bootstrap_log }}"
      register: bootstrap
      changed_when: true
      # Le script peut sortir en erreur si la séquence ANSI dérape : on ne fait
      # pas échouer toute la run ici, le wait_for ci-dessous tranchera.
      failed_when: false

    - name: Tracer la sortie du bootstrap (debug)
      when: bootstrap is not skipped
      ansible.builtin.debug:
        msg: "{{ bootstrap.stdout_lines | default([]) }} (log: {{ bootstrap_log }})"

    - name: Attendre que l'API et SSH répondent sur l'IP de management
      ansible.builtin.wait_for:
        host: "{{ mgmt_ip }}"
        port: "{{ item }}"
        timeout: 60
      loop: [8728, 22]
