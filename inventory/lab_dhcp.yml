# Inventaire de test : r1 joint en SSH via son IP DHCP (192.168.50.10).
# Prérequis réglés : DHCP (labdhcp) + passerelle hôte + ethtool tx off (checksum).
all:
  children:
    routers:
      hosts:
        r1:
          ansible_host: 192.168.50.10
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: community.routeros.routeros
        ansible_user: admin
        ansible_password: "Lab123!"
        ansible_command_timeout: 30
        ansible_host_key_checking: false
        # paramiko 4.x gère mal la clé ssh-rsa de RouterOS → on force libssh
        ansible_network_cli_ssh_type: libssh
