---
# r1 — routeur "router-on-a-stick" : une interface L3 par VLAN sur le trunk
# ether2, passerelle + serveur DHCP de chaque VLAN.
l3_interfaces:
  - { name: vlan10, parent: ether2, vlan: 10, ipv4: 192.168.10.1/24 }
  - { name: vlan20, parent: ether2, vlan: 20, ipv4: 192.168.20.1/24 }

dhcp_servers:
  - interface: vlan10
    network: 192.168.10.0/24
    gateway: 192.168.10.1
    range: { start: 192.168.10.100, end: 192.168.10.199 }
  - interface: vlan20
    network: 192.168.20.0/24
    gateway: 192.168.20.1
    range: { start: 192.168.20.100, end: 192.168.20.199 }
